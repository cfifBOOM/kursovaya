# Скриншоты страниц: GitHub запускает приложение, заполняет его примерами
# и сохраняет скриншоты в папку docs/screenshots. Запускается вручную (вкладка Actions).
name: Скриншоты

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Сборка
        run: mvn -B package -DskipTests

      - name: Установить Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Запуск приложения и скриншоты
        run: |
          java -jar target/office-equipment-1.0.0.jar > app.log 2>&1 &
          node .github/screenshots.js

      - name: Сохранить скриншоты в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Скриншоты с запущенного приложения" || echo "Скриншоты не изменились"
          git push

      - name: Лог приложения
        if: always()
        run: cat app.log || true
