<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <div class="card narrow">
        <h2>Вход</h2>
        <div class="alert alert-error" th:if="${param.error}">Неверный логин или пароль</div>
        <div class="alert alert-ok" th:if="${param.registered}">Регистрация прошла успешно, войдите</div>
        <div class="alert alert-ok" th:if="${param.logout}">Вы вышли из системы</div>
        <form th:action="@{/login}" method="post">
            <label for="username">Логин</label>
            <input id="username" name="username" required autofocus>
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" required>
            <p><button class="btn" type="submit">Войти</button></p>
        </form>
        <div class="link">Нет аккаунта? <a th:href="@{/register}">Регистрация</a></div>
    </div>
</main>
</body>
</html>
