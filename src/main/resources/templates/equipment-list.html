<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список оборудования</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Учет офисного оборудования</h1>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-light btn-small" type="submit">Выйти</button>
    </form>
</header>
<main>
    <div class="card">
        <h2>Список оборудования</h2>
        <div class="toolbar">
            <form th:action="@{/equipment}" method="get">
                <div>
                    <label for="type">Фильтр по типу</label>
                    <select id="type" name="type" onchange="this.form.submit()">
                        <option value="">Все типы</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.title}"
                                th:selected="${t == selectedType}"></option>
                    </select>
                </div>
                <noscript><button class="btn" type="submit">Применить</button></noscript>
            </form>
            <a class="btn" th:href="@{/equipment/new}">Добавить</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>Название</th>
                <th>Инвентарный номер</th>
                <th>Кабинет</th>
                <th>Тип</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${items}">
                <td th:text="${e.name}"></td>
                <td th:text="${e.inventoryNumber}"></td>
                <td th:text="${e.room}"></td>
                <td th:text="${e.equipmentType.title}"></td>
                <td>
                    <div class="actions">
                        <a class="btn btn-small" th:href="@{/equipment/{id}/edit(id=${e.id})}">Изменить</a>
                        <form th:action="@{/equipment/{id}/delete(id=${e.id})}" method="post"
                              onsubmit="return confirm('Удалить запись?')">
                            <button class="btn btn-danger btn-small" type="submit">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="5" class="empty">Записей нет</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
